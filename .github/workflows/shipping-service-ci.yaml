name: Shipping Service CI to GHCR

on:
  push:
    branches: ["shipping-service"]
  workflow_dispatch:

# Deny everything by default; each job asks only for what it needs (least privilege for GITHUB_TOKEN)
permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # the token is not needed after checkout: don't leave it on disk
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Syntax-check the JavaScript
        run: |
          node --check index.js

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Properly lowercase the repository path to satisfy GHCR rules
      - name: Docker Metadata Action (Handles lowercasing automatically)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/shipping-service
          tags: |
            type=raw,value=latest

      # Set up QEMU for multi-platform isolation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Set up Buildx properly so multi-stage tags don't break
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push using the clean, lowercased tags generated by the metadata step
      - name: Build and Push Shipping Service
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # While the internal engine of the container is running Linux, this container can run on Windows, macOS, or Linux.
          platforms: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # Stop Buildx from attaching the empty cache manifest layer to GHCR
          sbom: false
